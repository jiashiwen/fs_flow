[package]
name = "oss-pipe"
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/jd-opensource/oss_pipe"

[[bin]]
name = "oss_pipe"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["full", "tracing"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
clap = "4.6.1"
rustyline = "18.0.0"
rustyline-derive = "0.12.0"
shellwords = "1.1.0"
lazy_static = "1.5.0"
sysinfo = "0.39.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34-deprecated"
log = "0.4.32"
log4rs = "1.4.0"
rs-snowflake = "0.6.0"
async-trait = "0.1.89"
walkdir = "2.5.0"
bytes = "1.11.1"
rayon = "1.12.0"
time = "0.3.49"
rand = "0.10.1"
md-5 = "0.11"
num_cpus = "1.17.0"
dashmap = "6.2.1"
regex = "1.12.4"
termtree = "1.0.0"
indicatif = "0.18.4"
notify = "8.2.0"
tabled = "0.21.0"
rust_decimal = "1.42.1"
once_cell = "1.21.4"
thiserror = "2.0.18"
indexmap = "2.14.0"
uuid = { version = "1.23.3", features = ["v4"] }
governor = "0.10.4"

tracing = { version = "0.1.44", features = [
    "max_level_trace",
    "release_max_level_info",
] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
tracing-serde = "0.2.0"

# s3
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-s3 = "=1.68.0"
aws-credential-types = "1.2.14"
aws-smithy-types = "1.5.0"
aws-types = "1.3.16"
futures = "0.3.32"

[profile.release]
opt-level = "z"   # 或 "s"（更激进的大小优化）
lto = true        # 链接时优化
codegen-units = 1 # 牺牲并行编译换取更优体积
panic = "abort"   # 替换 panic 展开为直接终止
strip = true      # 自动去除符号信息
